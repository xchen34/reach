openapi: 3.1.0
info:
  title: Reach API
  description: Phase 1.5 voice intake foundation for Reach
  version: 0.3.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Health Check
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/request-magic-link:
    post:
      tags:
      - auth
      summary: Request Magic Link
      operationId: request_magic_link_auth_request_magic_link_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MagicLinkRequestResponse'
        '400':
          description: Magic link request rejected.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/verify-magic-link:
    post:
      tags:
      - auth
      summary: Verify Magic Link
      operationId: verify_magic_link_auth_verify_magic_link_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MagicLinkVerifyResponse'
        '400':
          description: Magic link verification failed.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      operationId: logout_auth_logout_post
      responses:
        '204':
          description: Successful Response
        '401':
          description: Missing, expired, revoked, or invalid bearer session.
      security:
      - bearerAuth: []
  /public/incidents/{incident_slug}/attachments:
    post:
      tags:
      - attachments
      summary: Upload Public Incident Attachments
      operationId: upload_public_incident_attachments_public_incidents__incident_slug__attachments_post
      parameters:
      - name: incident_slug
        in: path
        required: true
        schema:
          type: string
          title: Incident Slug
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_public_incident_attachments_public_incidents__incident_slug__attachments_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAttachmentUploadResponse'
        '400':
          description: Image validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Incident not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Image file exceeded the configured size limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
