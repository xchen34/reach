services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beacon
      POSTGRES_USER: beacon
      POSTGRES_PASSWORD: beacon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beacon -d beacon"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    working_dir: /app/apps/api
    environment:
      BEACON_APP_ENV: development
      BEACON_DATABASE_URL: postgresql+psycopg://beacon:beacon@db:5432/beacon
      BEACON_AUTH_TOKEN_SECRET: development-secret-key
      BEACON_MAGIC_LINK_BASE_URL: http://localhost:8000
      BEACON_DEV_MAGIC_LINK_MODE: response
      BEACON_DEV_DEFAULT_ROLE: volunteer
      BEACON_DEV_AUTO_CREATE_USERS: "true"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../apps/api:/app/apps/api

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    working_dir: /app/apps/web
    environment:
      API_INTERNAL_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    command: npm run dev
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ../apps/web:/app/apps/web

volumes:
  postgres_data:
