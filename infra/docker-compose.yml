services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: Reach
      POSTGRES_USER: Reach
      POSTGRES_PASSWORD: Reach
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Reach -d Reach"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    working_dir: /app/apps/api
    environment:
      Reach_APP_ENV: development
      Reach_DATABASE_URL: postgresql+psycopg://Reach:Reach@db:5432/Reach
      Reach_AUTH_TOKEN_SECRET: development-secret-key
      Reach_MAGIC_LINK_BASE_URL: http://localhost:8000
      Reach_DEV_MAGIC_LINK_MODE: response
      Reach_DEV_DEFAULT_ROLE: volunteer
      Reach_DEV_AUTO_CREATE_USERS: "true"
      Reach_GOOGLE_FORM_INGEST_TOKEN: ${Reach_GOOGLE_FORM_INGEST_TOKEN:-}
      Reach_GOOGLE_SHEETS_IMPORT_ENABLED: ${Reach_GOOGLE_SHEETS_IMPORT_ENABLED:-false}
      Reach_GOOGLE_SERVICE_ACCOUNT_JSON: ${Reach_GOOGLE_SERVICE_ACCOUNT_JSON:-}
      Reach_SPEECH_TO_TEXT_PROVIDER: development_stub
      Reach_VOICE_STORAGE_DIR: /app/data/voice_uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../apps/api:/app/apps/api
      - voice_uploads_data:/app/data/voice_uploads

  web:
    profiles: ["web"]
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    working_dir: /app/apps/web
    environment:
      API_INTERNAL_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_SAFE_REPORT_FORM_URL: ${NEXT_PUBLIC_SAFE_REPORT_FORM_URL:-}
      NEXT_PUBLIC_MISSING_REPORT_FORM_URL: ${NEXT_PUBLIC_MISSING_REPORT_FORM_URL:-}
      NEXT_PUBLIC_UPDATE_REPORT_FORM_URL: ${NEXT_PUBLIC_UPDATE_REPORT_FORM_URL:-}
      NEXT_PUBLIC_COMMUNITY_BOARD_URL: ${NEXT_PUBLIC_COMMUNITY_BOARD_URL:-}
      NEXT_PUBLIC_COMMUNITY_BOARD_EMBED_URL: ${NEXT_PUBLIC_COMMUNITY_BOARD_EMBED_URL:-}
    command: npm run dev
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ../apps/web:/app/apps/web

volumes:
  postgres_data:
  voice_uploads_data:
